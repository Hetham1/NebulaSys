name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nebula-dnf/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install frontend dependencies
        working-directory: nebula-dnf
        run: npm ci

      - name: Check frontend
        working-directory: nebula-dnf
        run: npm run check

      - name: Build frontend
        working-directory: nebula-dnf
        run: npm run build

      - name: Check Rust formatting
        working-directory: nebula-dnf/src-tauri
        run: cargo fmt --check

      - name: Test Rust
        working-directory: nebula-dnf/src-tauri
        run: cargo test

